
name: Build Kadam Family Record Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kadam_Family_Record_Manager_Android_Source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q Kadam_Family_Record_Manager_Android_Source.zip -d source
          find source -name settings.gradle -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -type f -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found in the ZIP."
            exit 1
          fi
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kadam-Family-Record-Manager-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
