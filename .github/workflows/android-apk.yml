
name: Build Kadam Family Record Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kadam_Family_Record_Manager_Android_Source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q Kadam_Family_Record_Manager_Android_Source.zip -d source

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android build
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kadam-Family-Record-Manager-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
